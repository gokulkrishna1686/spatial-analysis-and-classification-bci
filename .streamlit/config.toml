[server]
enableStaticServing = true
maxUploadSize = 500
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2F5BD3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#1B2130"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[logger]
level = "error"
